<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>vn-market-news demo</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f7f8;
    --panel: #ffffff;
    --text: #1a1a1a;
    --muted: #6b6b6b;
    --border: #e2e2e5;
    --accent: #3355dd;
    --error-bg: #fdecea;
    --error-text: #8a1c1c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17181c;
      --panel: #212227;
      --text: #eaeaea;
      --muted: #9a9a9a;
      --border: #34353b;
      --accent: #7c93ff;
      --error-bg: #3a2020;
      --error-text: #ffb3ab;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    padding: 1.25rem 1.5rem;
    border-bottom: 1px solid var(--border);
  }
  header h1 { margin: 0 0 0.25rem; font-size: 1.25rem; }
  header p { margin: 0; color: var(--muted); font-size: 0.9rem; }

  .layout {
    max-width: 900px;
    margin: 0 auto;
    padding: 1.5rem;
  }

  .tabs {
    display: flex;
    gap: 0.5rem;
    margin-bottom: 1rem;
  }
  .tab {
    padding: 0.5rem 1rem;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    cursor: pointer;
    font-size: 0.9rem;
  }
  .tab[aria-selected="true"] {
    background: var(--accent);
    border-color: var(--accent);
    color: white;
  }

  form {
    display: flex;
    flex-wrap: wrap;
    gap: 0.75rem;
    align-items: end;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1rem;
    margin-bottom: 1rem;
  }
  label { display: flex; flex-direction: column; gap: 0.3rem; font-size: 0.8rem; color: var(--muted); }
  input[type=text], input[type=number] {
    padding: 0.45rem 0.6rem;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 0.9rem;
  }
  input[type=number] { width: 5rem; }
  .sources { display: flex; flex-wrap: wrap; gap: 0.6rem; font-size: 0.85rem; color: var(--text); }
  .sources label { flex-direction: row; align-items: center; gap: 0.35rem; color: var(--text); }
  button {
    padding: 0.5rem 1.1rem;
    border-radius: 6px;
    border: none;
    background: var(--accent);
    color: white;
    font-size: 0.9rem;
    cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: default; }

  .status { color: var(--muted); font-size: 0.85rem; margin-bottom: 0.75rem; }

  .errors {
    background: var(--error-bg);
    color: var(--error-text);
    border-radius: 8px;
    padding: 0.75rem 1rem;
    margin-bottom: 1rem;
    font-size: 0.85rem;
  }
  .errors ul { margin: 0.3rem 0 0; padding-left: 1.2rem; }

  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0.9rem 1.1rem;
    margin-bottom: 0.75rem;
  }
  .card h3 { margin: 0 0 0.4rem; font-size: 1rem; }
  .card h3 a { color: var(--text); text-decoration: none; }
  .card h3 a:hover { text-decoration: underline; }
  .meta {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    font-size: 0.75rem;
    color: var(--muted);
    margin-bottom: 0.4rem;
  }
  .badge {
    display: inline-block;
    padding: 0.1rem 0.5rem;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--bg);
  }
  .summary { font-size: 0.88rem; color: var(--text); line-height: 1.4; margin: 0; }
  .empty { color: var(--muted); font-size: 0.9rem; }
</style>
</head>
<body>
  <header>
    <h1>vn-market-news demo</h1>
    <p>Local UI over the vn-market-news library — market news, per-ticker news, and search.</p>
  </header>

  <div class="layout">
    <div class="tabs" role="tablist">
      <button class="tab" data-tab="market" role="tab" aria-selected="true">Market news</button>
      <button class="tab" data-tab="company" role="tab" aria-selected="false">Company news</button>
      <button class="tab" data-tab="search" role="tab" aria-selected="false">Search</button>
    </div>

    <form id="form">
      <label id="ticker-field" style="display:none">
        Ticker
        <input type="text" id="ticker" placeholder="HPG" />
      </label>
      <label id="keyword-field" style="display:none">
        Keyword
        <input type="text" id="keyword" placeholder="lãi suất ngân hàng" />
      </label>
      <label>
        Limit
        <input type="number" id="limit" value="15" min="1" max="100" />
      </label>
      <div class="sources" id="sources">
        <span style="color:var(--muted)">Sources:</span>
        <label><input type="checkbox" value="hose" checked /> hose</label>
        <label><input type="checkbox" value="vietstock" checked /> vietstock</label>
        <label><input type="checkbox" value="cafef" checked /> cafef</label>
        <label><input type="checkbox" value="google-news" checked /> google-news</label>
      </div>
      <button type="submit" id="submit">Fetch</button>
    </form>

    <div class="status" id="status"></div>
    <div id="errors"></div>
    <div id="results"></div>
  </div>

<script>
  const tabs = document.querySelectorAll('.tab');
  const tickerField = document.getElementById('ticker-field');
  const keywordField = document.getElementById('keyword-field');
  let activeTab = 'market';

  function setTab(name) {
    activeTab = name;
    tabs.forEach((t) => t.setAttribute('aria-selected', String(t.dataset.tab === name)));
    tickerField.style.display = name === 'company' ? 'flex' : 'none';
    keywordField.style.display = name === 'search' ? 'flex' : 'none';
  }
  tabs.forEach((t) => t.addEventListener('click', () => setTab(t.dataset.tab)));

  const form = document.getElementById('form');
  const statusEl = document.getElementById('status');
  const errorsEl = document.getElementById('errors');
  const resultsEl = document.getElementById('results');
  const submitBtn = document.getElementById('submit');

  function selectedSources() {
    return [...document.querySelectorAll('#sources input[type=checkbox]:checked')].map((c) => c.value);
  }

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  function renderResults(data) {
    errorsEl.innerHTML = '';
    if (data.sourceErrors?.length) {
      errorsEl.innerHTML = `<div class="errors"><strong>${data.sourceErrors.length} source(s) failed:</strong>
        <ul>${data.sourceErrors.map((e) => `<li>[${escapeHtml(e.source)}] ${escapeHtml(e.message)}</li>`).join('')}</ul>
      </div>`;
    }

    if (!data.items?.length) {
      resultsEl.innerHTML = '<p class="empty">No items returned.</p>';
      return;
    }

    resultsEl.innerHTML = data.items.map((item) => {
      const tickers = item.tickers?.length
        ? `<span class="badge">${item.tickers.join(', ')}${item.tickerConfidence ? ` (${item.tickerConfidence})` : ''}</span>`
        : '';
      const date = new Date(item.publishedAt).toLocaleString();
      return `
        <article class="card">
          <h3><a href="${item.url}" target="_blank" rel="noopener">${escapeHtml(item.title)}</a></h3>
          <div class="meta">
            <span class="badge">${escapeHtml(item.source)}</span>
            <span class="badge">${escapeHtml(item.sourceType)}</span>
            ${tickers}
            <span>${date}</span>
            ${item.originalSource ? `<span>via ${escapeHtml(item.originalSource)}</span>` : ''}
          </div>
          ${item.summary ? `<p class="summary">${escapeHtml(item.summary)}</p>` : ''}
        </article>`;
    }).join('');
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const limit = document.getElementById('limit').value || '15';
    const sources = selectedSources().join(',');

    let path;
    if (activeTab === 'market') {
      path = `/api/market?limit=${encodeURIComponent(limit)}&sources=${encodeURIComponent(sources)}`;
    } else if (activeTab === 'company') {
      const ticker = document.getElementById('ticker').value.trim();
      if (!ticker) { statusEl.textContent = 'Enter a ticker first.'; return; }
      path = `/api/company?ticker=${encodeURIComponent(ticker)}&limit=${encodeURIComponent(limit)}&sources=${encodeURIComponent(sources)}`;
    } else {
      const keyword = document.getElementById('keyword').value.trim();
      if (!keyword) { statusEl.textContent = 'Enter a keyword first.'; return; }
      path = `/api/search?keyword=${encodeURIComponent(keyword)}&limit=${encodeURIComponent(limit)}&sources=${encodeURIComponent(sources)}`;
    }

    submitBtn.disabled = true;
    statusEl.textContent = 'Loading…';
    errorsEl.innerHTML = '';
    resultsEl.innerHTML = '';

    const started = performance.now();
    try {
      const res = await fetch(path);
      const data = await res.json();
      if (!res.ok) {
        statusEl.textContent = '';
        errorsEl.innerHTML = `<div class="errors">${escapeHtml(data.error || 'Request failed')}</div>`;
        return;
      }
      const took = Math.round(performance.now() - started);
      statusEl.textContent = `${data.items.length} item(s) in ${took}ms (generated ${new Date(data.generatedAt).toLocaleTimeString()})`;
      renderResults(data);
    } catch (err) {
      statusEl.textContent = '';
      errorsEl.innerHTML = `<div class="errors">${escapeHtml(err.message)}</div>`;
    } finally {
      submitBtn.disabled = false;
    }
  });

  setTab('market');
</script>
</body>
</html>
