<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>vn-market-news demo</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f7f8;
    --panel: #ffffff;
    --text: #1a1a1a;
    --muted: #6b6b6b;
    --border: #e2e2e5;
    --accent: #3355dd;
    --error-bg: #fdecea;
    --error-text: #8a1c1c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17181c;
      --panel: #212227;
      --text: #eaeaea;
      --muted: #9a9a9a;
      --border: #34353b;
      --accent: #7c93ff;
      --error-bg: #3a2020;
      --error-text: #ffb3ab;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    padding: 1.25rem 1.5rem;
    border-bottom: 1px solid var(--border);
  }
  header h1 { margin: 0 0 0.25rem; font-size: 1.25rem; }
  header p { margin: 0; color: var(--muted); font-size: 0.9rem; }

  .layout {
    max-width: 900px;
    margin: 0 auto;
    padding: 1.5rem;
  }

  .tabs {
    display: flex;
    gap: 0.5rem;
    margin-bottom: 1rem;
  }
  .tab {
    padding: 0.5rem 1rem;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    cursor: pointer;
    font-size: 0.9rem;
  }
  .tab[aria-selected="true"] {
    background: var(--accent);
    border-color: var(--accent);
    color: white;
  }

  form {
    display: flex;
    flex-wrap: wrap;
    gap: 0.75rem;
    align-items: end;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1rem;
    margin-bottom: 1rem;
  }
  label { display: flex; flex-direction: column; gap: 0.3rem; font-size: 0.8rem; color: var(--muted); }
  input[type=text], input[type=number] {
    padding: 0.45rem 0.6rem;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 0.9rem;
  }
  input[type=number] { width: 5rem; }
  .sources { display: flex; flex-wrap: wrap; gap: 0.6rem; font-size: 0.85rem; color: var(--text); }
  .sources label { flex-direction: row; align-items: center; gap: 0.35rem; color: var(--text); }
  button {
    padding: 0.5rem 1.1rem;
    border-radius: 6px;
    border: none;
    background: var(--accent);
    color: white;
    font-size: 0.9rem;
    cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: default; }

  .status { color: var(--muted); font-size: 0.85rem; margin-bottom: 0.75rem; }

  .errors {
    background: var(--error-bg);
    color: var(--error-text);
    border-radius: 8px;
    padding: 0.75rem 1rem;
    margin-bottom: 1rem;
    font-size: 0.85rem;
  }
  .errors ul { margin: 0.3rem 0 0; padding-left: 1.2rem; }

  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0.9rem 1.1rem;
    margin-bottom: 0.75rem;
  }
  .card h3 { margin: 0 0 0.4rem; font-size: 1rem; }
  .card h3 a { color: var(--text); text-decoration: none; }
  .card h3 a:hover { text-decoration: underline; }
  .meta {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    font-size: 0.75rem;
    color: var(--muted);
    margin-bottom: 0.4rem;
  }
  .badge {
    display: inline-block;
    padding: 0.1rem 0.5rem;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--bg);
  }
  .summary { font-size: 0.88rem; color: var(--text); line-height: 1.4; margin: 0; }
  .empty { color: var(--muted); font-size: 0.9rem; }

  select {
    padding: 0.45rem 0.6rem;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 0.9rem;
  }
  .fin-table-wrap { overflow-x: auto; }
  .fin-table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
  .fin-table th, .fin-table td { padding: 0.35rem 0.6rem; border-bottom: 1px solid var(--border); }
  .fin-table th { text-align: right; white-space: nowrap; }
  .fin-table th:first-child, .fin-table td:first-child { text-align: left; }
  .fin-table td:not(:first-child) { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .fin-table .name-vi { color: var(--muted); font-size: 0.75rem; }
  .text-table td, .text-table th { text-align: left !important; white-space: normal !important; font-variant-numeric: normal !important; }
  .fund-card { cursor: pointer; }
  .fund-card:hover { border-color: var(--accent); }
  .fund-detail-btn {
    margin-top: 0.5rem;
    padding: 0.3rem 0.8rem;
    font-size: 0.78rem;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--accent);
    cursor: pointer;
  }
</style>
</head>
<body>
  <header>
    <h1>vn-market-news demo</h1>
    <p>Local UI over the vn-market-news library — news, financial statements, and mutual fund data.</p>
  </header>

  <div class="layout">
    <div class="tabs" role="tablist">
      <button class="tab" data-tab="market" role="tab" aria-selected="true">Market news</button>
      <button class="tab" data-tab="company" role="tab" aria-selected="false">Company news</button>
      <button class="tab" data-tab="search" role="tab" aria-selected="false">Search</button>
      <button class="tab" data-tab="financials" role="tab" aria-selected="false">Financials</button>
      <button class="tab" data-tab="company-info" role="tab" aria-selected="false">Company info</button>
      <button class="tab" data-tab="symbols" role="tab" aria-selected="false">Symbols</button>
      <button class="tab" data-tab="funds" role="tab" aria-selected="false">Funds</button>
    </div>

    <form id="form">
      <label id="ticker-field" style="display:none">
        Ticker
        <input type="text" id="ticker" placeholder="HPG" />
      </label>
      <label id="keyword-field" style="display:none">
        Keyword
        <input type="text" id="keyword" placeholder="lãi suất ngân hàng" />
      </label>
      <div id="financials-fields" style="display:none; gap:0.75rem; flex-wrap:wrap;">
        <label>
          Statement type
          <select id="statement-type">
            <option value="balance_sheet">balance_sheet</option>
            <option value="income_statement">income_statement</option>
            <option value="cash_flow">cash_flow</option>
            <option value="ratios">ratios</option>
          </select>
        </label>
        <label>
          Period
          <select id="period-type">
            <option value="year">year</option>
            <option value="quarter">quarter</option>
          </select>
        </label>
        <label>
          Source
          <select id="financials-source">
            <option value="kbs">kbs</option>
            <option value="vci">vci</option>
          </select>
        </label>
      </div>
      <div id="company-info-fields" style="display:none; gap:0.75rem; flex-wrap:wrap;">
        <label>
          Source
          <select id="company-info-source">
            <option value="kbs">kbs</option>
            <option value="vci">vci</option>
          </select>
        </label>
      </div>
      <div id="symbols-fields" style="display:none; gap:0.75rem; flex-wrap:wrap;">
        <label>
          Type
          <select id="symbol-type">
            <option value="stock">stock</option>
            <option value="fund">fund</option>
            <option value="bond">bond</option>
            <option value="corpbond">corpbond</option>
            <option value="cw">cw</option>
            <option value="future">future</option>
          </select>
        </label>
        <label>
          Search (symbol or name)
          <input type="text" id="symbol-query" placeholder="hoa phat" />
        </label>
      </div>
      <div id="funds-fields" style="display:none; gap:0.75rem; flex-wrap:wrap;">
        <label>
          Mode
          <select id="fund-mode">
            <option value="search">Search funds</option>
            <option value="detail">Fund detail</option>
          </select>
        </label>
        <label>
          Symbol / search text
          <input type="text" id="fund-query" placeholder="VESAF" />
        </label>
        <label id="nav-history-field" style="display:none; flex-direction:row; align-items:center; gap:0.35rem;">
          <input type="checkbox" id="include-nav-history" />
          Include NAV history
        </label>
      </div>
      <label id="limit-field">
        Limit
        <input type="number" id="limit" value="15" min="1" max="100" />
      </label>
      <div class="sources" id="sources">
        <span style="color:var(--muted)">Sources:</span>
        <label><input type="checkbox" value="hose" checked /> hose</label>
        <label><input type="checkbox" value="vietstock" checked /> vietstock</label>
        <label><input type="checkbox" value="cafef" checked /> cafef</label>
        <label><input type="checkbox" value="google-news" checked /> google-news</label>
        <label><input type="checkbox" value="vnexpress" checked /> vnexpress</label>
        <label><input type="checkbox" value="cafebiz" checked /> cafebiz</label>
        <label><input type="checkbox" value="vneconomy" checked /> vneconomy</label>
        <label><input type="checkbox" value="dddn" checked /> dddn</label>
        <label><input type="checkbox" value="znews" checked /> znews</label>
      </div>
      <button type="submit" id="submit">Fetch</button>
    </form>

    <div class="status" id="status"></div>
    <div id="errors"></div>
    <div id="results"></div>
  </div>

<script>
  const tabs = document.querySelectorAll('.tab');
  const tickerField = document.getElementById('ticker-field');
  const keywordField = document.getElementById('keyword-field');
  const financialsFields = document.getElementById('financials-fields');
  const companyInfoFields = document.getElementById('company-info-fields');
  const symbolsFields = document.getElementById('symbols-fields');
  const fundsFields = document.getElementById('funds-fields');
  const navHistoryField = document.getElementById('nav-history-field');
  const limitField = document.getElementById('limit-field');
  const sourcesField = document.getElementById('sources');
  const fundModeSelect = document.getElementById('fund-mode');
  let activeTab = 'market';

  function setTab(name) {
    activeTab = name;
    tabs.forEach((t) => t.setAttribute('aria-selected', String(t.dataset.tab === name)));
    tickerField.style.display = (name === 'company' || name === 'financials' || name === 'company-info') ? 'flex' : 'none';
    keywordField.style.display = name === 'search' ? 'flex' : 'none';
    financialsFields.style.display = name === 'financials' ? 'flex' : 'none';
    companyInfoFields.style.display = name === 'company-info' ? 'flex' : 'none';
    symbolsFields.style.display = name === 'symbols' ? 'flex' : 'none';
    fundsFields.style.display = name === 'funds' ? 'flex' : 'none';
    limitField.style.display = (name === 'financials' || name === 'company-info') ? 'none' : 'flex';
    sourcesField.style.display = (name === 'financials' || name === 'funds' || name === 'company-info' || name === 'symbols') ? 'none' : 'flex';
    if (name === 'funds') updateFundMode();
    errorsEl.innerHTML = '';
    resultsEl.innerHTML = '';
    statusEl.textContent = '';
  }
  tabs.forEach((t) => t.addEventListener('click', () => setTab(t.dataset.tab)));

  function updateFundMode() {
    navHistoryField.style.display = fundModeSelect.value === 'detail' ? 'flex' : 'none';
  }
  fundModeSelect.addEventListener('change', updateFundMode);

  const form = document.getElementById('form');
  const statusEl = document.getElementById('status');
  const errorsEl = document.getElementById('errors');
  const resultsEl = document.getElementById('results');
  const submitBtn = document.getElementById('submit');

  function selectedSources() {
    return [...document.querySelectorAll('#sources input[type=checkbox]:checked')].map((c) => c.value);
  }

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  function renderResults(data) {
    errorsEl.innerHTML = '';
    if (data.sourceErrors?.length) {
      errorsEl.innerHTML = `<div class="errors"><strong>${data.sourceErrors.length} source(s) failed:</strong>
        <ul>${data.sourceErrors.map((e) => `<li>[${escapeHtml(e.source)}] ${escapeHtml(e.message)}</li>`).join('')}</ul>
      </div>`;
    }

    if (!data.items?.length) {
      resultsEl.innerHTML = '<p class="empty">No items returned.</p>';
      return;
    }

    resultsEl.innerHTML = data.items.map((item) => {
      const tickers = item.tickers?.length
        ? `<span class="badge">${item.tickers.join(', ')}${item.tickerConfidence ? ` (${item.tickerConfidence})` : ''}</span>`
        : '';
      const date = new Date(item.publishedAt).toLocaleString();
      return `
        <article class="card">
          <h3><a href="${item.url}" target="_blank" rel="noopener">${escapeHtml(item.title)}</a></h3>
          <div class="meta">
            <span class="badge">${escapeHtml(item.source)}</span>
            <span class="badge">${escapeHtml(item.sourceType)}</span>
            ${tickers}
            <span>${date}</span>
            ${item.originalSource ? `<span>via ${escapeHtml(item.originalSource)}</span>` : ''}
          </div>
          ${item.summary ? `<p class="summary">${escapeHtml(item.summary)}</p>` : ''}
        </article>`;
    }).join('');
  }

  function renderFinancials(data) {
    const periods = data.periods;
    const header = periods.map((p) => {
      const flags = [p.consolidated ? 'consol.' : 'standalone', p.auditStatus].filter(Boolean).join(', ');
      return `<th>${escapeHtml(p.label)}${flags ? `<br><span class="name-vi">${escapeHtml(flags)}</span>` : ''}</th>`;
    }).join('');

    const rows = data.items.map((item) => {
      const indent = '&nbsp;&nbsp;'.repeat(item.level);
      const cells = periods.map((p) => {
        const v = item.values[p.label];
        return `<td>${v == null ? '—' : v.toLocaleString()}</td>`;
      }).join('');
      return `<tr><td>${indent}${escapeHtml(item.name)}${item.nameVi ? `<br><span class="name-vi">${escapeHtml(item.nameVi)}</span>` : ''}</td>${cells}</tr>`;
    }).join('');

    resultsEl.innerHTML = `
      <div class="card">
        <div class="meta">
          <span class="badge">${escapeHtml(data.ticker)}</span>
          <span class="badge">source: ${escapeHtml(data.source)}</span>
          <span class="badge">${escapeHtml(data.statementType)}</span>
          <span class="badge">${escapeHtml(data.periodType)}</span>
          <span class="badge">${escapeHtml(data.currency)}${data.unitScale != null && data.unitScale !== 1 ? ` × ${data.unitScale}` : ''}</span>
        </div>
        <div class="fin-table-wrap">
          <table class="fin-table">
            <thead><tr><th>Line item</th>${header}</tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      </div>`;
  }

  function renderCompanyInfo(data, name) {
    const p = data.profile;
    const officerRows = data.officers.map((o) => `
      <tr><td>${escapeHtml(o.name)}</td><td>${escapeHtml(o.position || '—')}</td><td>${escapeHtml(o.fromDate || '—')}</td></tr>`).join('');
    const shareholderRows = data.shareholders.map((s) => `
      <tr><td>${escapeHtml(s.name)}</td><td>${s.sharesOwned != null ? s.sharesOwned.toLocaleString() : '—'}</td><td>${s.ownershipPercent != null ? s.ownershipPercent.toFixed(2) + '%' : '—'}</td></tr>`).join('');
    const ownershipRows = data.ownership.map((o) => `
      <tr><td>${escapeHtml(o.ownerType)}</td><td>${o.ownershipPercent != null ? o.ownershipPercent.toFixed(2) + '%' : '—'}</td></tr>`).join('');
    const subsidiaryRows = data.subsidiaries.map((s) => `
      <tr><td>${escapeHtml(s.name)}</td><td>${s.ownershipPercent != null ? s.ownershipPercent.toFixed(2) + '%' : '—'}</td></tr>`).join('');

    resultsEl.innerHTML = `
      <div class="card">
        <h3>${escapeHtml(data.ticker)}${name?.name ? ` — ${escapeHtml(name.name)}` : ''} <span class="name-vi">${escapeHtml(p.companyType || '')}</span></h3>
        ${name?.nameEn ? `<p class="name-vi" style="margin:0 0 0.5rem;">${escapeHtml(name.nameEn)}</p>` : ''}
        <div class="meta">
          <span class="badge">source: ${escapeHtml(data.source)}</span>
          ${p.exchange ? `<span class="badge">${escapeHtml(p.exchange)}</span>` : ''}
          ${p.sectorVn ? `<span class="badge">${escapeHtml(p.sectorVn)}</span>` : ''}
          ${p.charterCapital != null ? `<span class="badge">Charter capital ${p.charterCapital.toLocaleString()} VND</span>` : ''}
          ${p.numberOfEmployees != null ? `<span>${p.numberOfEmployees.toLocaleString()} employees</span>` : ''}
          ${p.ceoName ? `<span>CEO: ${escapeHtml(p.ceoName)}</span>` : ''}
        </div>
        <p class="summary">${escapeHtml(p.businessModel || 'No business description reported.')}</p>
        <div class="meta">
          ${p.address ? `<span>${escapeHtml(p.address)}</span>` : ''}
          ${p.website ? `<span><a href="${p.website}" target="_blank" rel="noopener">${escapeHtml(p.website)}</a></span>` : ''}
        </div>
        <h4 style="margin-bottom:0.3rem;">Officers</h4>
        <div class="fin-table-wrap">
          <table class="fin-table text-table">
            <thead><tr><th>Name</th><th>Position</th><th>From</th></tr></thead>
            <tbody>${officerRows || '<tr><td colspan="3" class="empty">None reported</td></tr>'}</tbody>
          </table>
        </div>
        <h4 style="margin:0.75rem 0 0.3rem;">Major shareholders</h4>
        <div class="fin-table-wrap">
          <table class="fin-table">
            <thead><tr><th>Name</th><th>Shares</th><th>% owned</th></tr></thead>
            <tbody>${shareholderRows || '<tr><td colspan="3" class="empty">None reported</td></tr>'}</tbody>
          </table>
        </div>
        <h4 style="margin:0.75rem 0 0.3rem;">Ownership structure</h4>
        <div class="fin-table-wrap">
          <table class="fin-table">
            <thead><tr><th>Holder type</th><th>% owned</th></tr></thead>
            <tbody>${ownershipRows || '<tr><td colspan="2" class="empty">None reported</td></tr>'}</tbody>
          </table>
        </div>
        <h4 style="margin:0.75rem 0 0.3rem;">Subsidiaries / affiliates</h4>
        <div class="fin-table-wrap">
          <table class="fin-table">
            <thead><tr><th>Name</th><th>% owned</th></tr></thead>
            <tbody>${subsidiaryRows || '<tr><td colspan="2" class="empty">None reported</td></tr>'}</tbody>
          </table>
        </div>
      </div>`;
  }

  function renderSymbols(data) {
    if (!data.symbols?.length) {
      resultsEl.innerHTML = '<p class="empty">No symbols matched.</p>';
      return;
    }
    const rows = data.symbols.map((s) => `
      <tr>
        <td>${escapeHtml(s.symbol)}</td>
        <td>${escapeHtml(s.name || '—')}</td>
        <td>${escapeHtml(s.nameEn || '—')}</td>
        <td>${escapeHtml(s.exchange || '—')}</td>
      </tr>`).join('');
    resultsEl.innerHTML = `
      <div class="fin-table-wrap">
        <table class="fin-table text-table">
          <thead><tr><th>Symbol</th><th>Name</th><th>Name (EN)</th><th>Exchange</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>`;
  }

  function fundCardHtml(fund) {
    const c = fund.navChangePercent || {};
    const chip = (label, v) => (v == null ? '' : `<span class="badge">${label} ${v > 0 ? '+' : ''}${v.toFixed(2)}%</span>`);
    return `
      <article class="card fund-card">
        <h3>${escapeHtml(fund.shortName)} <span class="name-vi">${escapeHtml(fund.name)}</span></h3>
        <div class="meta">
          ${fund.assetType ? `<span class="badge">${escapeHtml(fund.assetType)}</span>` : ''}
          <span class="badge">NAV ${fund.nav.toLocaleString()}</span>
          ${fund.managerName ? `<span>${escapeHtml(fund.managerName)}</span>` : ''}
          ${fund.managementFee != null ? `<span>fee ${fund.managementFee}%</span>` : ''}
        </div>
        <div class="meta">${chip('1y', c.m12)} ${chip('YTD', c.ytd)} ${chip('since inception', c.sinceInception)}</div>
        <button type="button" class="fund-detail-btn" data-symbol="${escapeHtml(fund.shortName)}">View detail →</button>
      </article>`;
  }

  function renderFundSearch(data) {
    if (!data.funds?.length) {
      resultsEl.innerHTML = '<p class="empty">No funds matched.</p>';
      return;
    }
    resultsEl.innerHTML = data.funds.map(fundCardHtml).join('');
    resultsEl.querySelectorAll('.fund-detail-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        document.getElementById('fund-query').value = btn.dataset.symbol;
        fundModeSelect.value = 'detail';
        updateFundMode();
        runQuery();
      });
    });
  }

  function renderFundDetail(data) {
    const holdingsRows = data.topHoldings.map((h) => `
      <tr>
        <td>${escapeHtml(h.code || '—')}</td>
        <td>${escapeHtml(h.assetType)}</td>
        <td>${escapeHtml(h.industry || '—')}</td>
        <td>${h.netAssetPercent.toFixed(2)}%</td>
      </tr>`).join('');

    const industryRows = data.industryAllocation
      .map((i) => `<li>${escapeHtml(i.industry)}: ${i.assetPercent.toFixed(2)}%</li>`).join('');
    const assetRows = data.assetAllocation
      .map((a) => `<li>${escapeHtml(a.assetType)}: ${a.assetPercent.toFixed(2)}%</li>`).join('');

    let navSection = '';
    if (data.navHistory?.length) {
      const first = data.navHistory[0];
      const last = data.navHistory[data.navHistory.length - 1];
      navSection = `
        <div class="meta">
          <span class="badge">NAV history: ${data.navHistory.length} point(s)</span>
          <span>${escapeHtml(first.date)} → ${first.nav.toLocaleString()}</span>
          <span>${escapeHtml(last.date)} → ${last.nav.toLocaleString()}</span>
        </div>`;
    }

    resultsEl.innerHTML = `
      <div class="card">
        <h3>${escapeHtml(data.fund.shortName)} <span class="name-vi">${escapeHtml(data.fund.name)}</span></h3>
        <div class="meta">
          ${data.fund.assetType ? `<span class="badge">${escapeHtml(data.fund.assetType)}</span>` : ''}
          <span class="badge">NAV ${data.fund.nav.toLocaleString()}</span>
          ${data.fund.managerName ? `<span>${escapeHtml(data.fund.managerName)}</span>` : ''}
        </div>
        ${navSection}
        <h4 style="margin-bottom:0.3rem;">Top holdings</h4>
        <div class="fin-table-wrap">
          <table class="fin-table">
            <thead><tr><th>Code</th><th>Type</th><th>Industry</th><th>% NAV</th></tr></thead>
            <tbody>${holdingsRows || '<tr><td colspan="4" class="empty">None reported</td></tr>'}</tbody>
          </table>
        </div>
        <h4 style="margin:0.75rem 0 0.3rem;">Industry allocation</h4>
        <ul style="margin:0; padding-left:1.2rem; font-size:0.85rem;">${industryRows || '<li class="empty">None reported</li>'}</ul>
        <h4 style="margin:0.75rem 0 0.3rem;">Asset allocation</h4>
        <ul style="margin:0; padding-left:1.2rem; font-size:0.85rem;">${assetRows || '<li class="empty">None reported</li>'}</ul>
      </div>`;
  }

  async function runQuery() {
    const limit = document.getElementById('limit').value || '15';
    const sources = selectedSources().join(',');

    let path;
    let kind;
    if (activeTab === 'market') {
      kind = 'news';
      path = `/api/market?limit=${encodeURIComponent(limit)}&sources=${encodeURIComponent(sources)}`;
    } else if (activeTab === 'company') {
      kind = 'news';
      const ticker = document.getElementById('ticker').value.trim();
      if (!ticker) { statusEl.textContent = 'Enter a ticker first.'; return; }
      path = `/api/company?ticker=${encodeURIComponent(ticker)}&limit=${encodeURIComponent(limit)}&sources=${encodeURIComponent(sources)}`;
    } else if (activeTab === 'search') {
      kind = 'news';
      const keyword = document.getElementById('keyword').value.trim();
      if (!keyword) { statusEl.textContent = 'Enter a keyword first.'; return; }
      path = `/api/search?keyword=${encodeURIComponent(keyword)}&limit=${encodeURIComponent(limit)}&sources=${encodeURIComponent(sources)}`;
    } else if (activeTab === 'financials') {
      kind = 'financials';
      const ticker = document.getElementById('ticker').value.trim();
      if (!ticker) { statusEl.textContent = 'Enter a ticker first.'; return; }
      const statementType = document.getElementById('statement-type').value;
      const period = document.getElementById('period-type').value;
      const finSource = document.getElementById('financials-source').value;
      path = `/api/financials?ticker=${encodeURIComponent(ticker)}&statementType=${statementType}&period=${period}&source=${finSource}`;
    } else if (activeTab === 'company-info') {
      kind = 'company-info';
      const ticker = document.getElementById('ticker').value.trim();
      if (!ticker) { statusEl.textContent = 'Enter a ticker first.'; return; }
      const source = document.getElementById('company-info-source').value;
      path = `/api/company-info?ticker=${encodeURIComponent(ticker)}&source=${encodeURIComponent(source)}`;
    } else if (activeTab === 'symbols') {
      kind = 'symbols';
      const type = document.getElementById('symbol-type').value;
      const query = document.getElementById('symbol-query').value.trim();
      path = `/api/symbols?type=${encodeURIComponent(type)}&query=${encodeURIComponent(query)}&limit=${encodeURIComponent(limit)}`;
    } else {
      const query = document.getElementById('fund-query').value.trim();
      if (fundModeSelect.value === 'detail') {
        kind = 'fund-detail';
        if (!query) { statusEl.textContent = 'Enter a fund symbol first.'; return; }
        const includeNavHistory = document.getElementById('include-nav-history').checked;
        path = `/api/funds/detail?symbol=${encodeURIComponent(query)}&includeNavHistory=${includeNavHistory}`;
      } else {
        kind = 'fund-search';
        path = `/api/funds/search?query=${encodeURIComponent(query)}&limit=${encodeURIComponent(limit)}`;
      }
    }

    submitBtn.disabled = true;
    statusEl.textContent = 'Loading…';
    errorsEl.innerHTML = '';
    resultsEl.innerHTML = '';

    const started = performance.now();
    try {
      const res = await fetch(path);
      const data = await res.json();
      if (!res.ok) {
        statusEl.textContent = '';
        errorsEl.innerHTML = `<div class="errors">${escapeHtml(data.error || 'Request failed')}</div>`;
        return;
      }
      const took = Math.round(performance.now() - started);
      if (kind === 'news') {
        statusEl.textContent = `${data.items.length} item(s) in ${took}ms (generated ${new Date(data.generatedAt).toLocaleTimeString()})`;
        renderResults(data);
      } else if (kind === 'financials') {
        statusEl.textContent = `${data.items.length} line item(s) × ${data.periods.length} period(s) in ${took}ms`;
        renderFinancials(data);
      } else if (kind === 'fund-search') {
        statusEl.textContent = `${data.funds.length} fund(s) in ${took}ms`;
        renderFundSearch(data);
      } else if (kind === 'symbols') {
        statusEl.textContent = `${data.symbols.length} symbol(s) in ${took}ms`;
        renderSymbols(data);
      } else if (kind === 'company-info') {
        let name;
        try {
          const symbolsRes = await fetch('/api/symbols?type=stock');
          const symbolsData = await symbolsRes.json();
          name = symbolsData.symbols?.find((s) => s.symbol === data.ticker);
        } catch {
          // Name lookup is best-effort — the profile endpoint has no name field, and
          // the listing endpoint is a separate ~470KB call that can fail independently.
        }
        const took2 = Math.round(performance.now() - started);
        statusEl.textContent = `Fetched ${escapeHtml(data.ticker)} in ${took2}ms`;
        renderCompanyInfo(data, name);
      } else {
        statusEl.textContent = `Fetched ${escapeHtml(data.fund.shortName)} in ${took}ms`;
        renderFundDetail(data);
      }
    } catch (err) {
      statusEl.textContent = '';
      errorsEl.innerHTML = `<div class="errors">${escapeHtml(err.message)}</div>`;
    } finally {
      submitBtn.disabled = false;
    }
  }

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    runQuery();
  });

  setTab('market');
</script>
</body>
</html>
